name: Test build

# Builds unsigned installers to try out before a release: the Windows setup file and the Linux
# packages (.deb, .rpm, AppImage). They are not signed for the in-app updater and are never
# published: download them from the run's Artifacts.
# Run it from the Actions tab, or push a branch named test-build/<anything>.
on:
  workflow_dispatch:
  push:
    branches: ["test-build/**"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the installer (unsigned)
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Installer size
        shell: bash
        run: ls -l src-tauri/target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: paperlight-test-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    # The oldest supported Ubuntu, so the packages run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # tauri.linux.conf.json picks the Linux packages and turns updater signing off.
      - name: Build the packages (unsigned)
        run: npm run tauri build

      - name: Package sizes
        run: ls -l src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: paperlight-test-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
