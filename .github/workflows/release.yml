name: Release

# Pushing a version tag (v1.1.0) builds the signed Windows installer and drafts a GitHub release
# with it, its signature and latest.json, then adds the Linux packages (.deb, .rpm, AppImage)
# to the same draft. Installed copies of Paperlight see the update only after the draft is
# published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A tag's cache can never be reused by the next tag, so don't store one.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version in tauri.conf.json"
          }

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notes = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[') {
              if ($inside) { break }
              $inside = $line -match "^## \[$([regex]::Escape($version))\]"
              continue
            }
            if ($inside) { $notes += $line }
          }
          if (-not $notes) { throw "CHANGELOG.md has no section for $version" }
          Add-Content $env:GITHUB_OUTPUT "body<<PAPERLIGHT_NOTES"
          Add-Content $env:GITHUB_OUTPUT (($notes -join "`n").Trim())
          Add-Content $env:GITHUB_OUTPUT "PAPERLIGHT_NOTES"

      - name: Build, sign and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Paperlight ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  # Linux packages, added to the draft the Windows job created. They are not part of the
  # in-app updater (see tauri.linux.conf.json), so latest.json is left alone.
  linux:
    needs: release
    # The oldest supported Ubuntu, so the packages run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the packages and add them to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Paperlight ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
